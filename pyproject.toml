[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hearweave"
version = "0.3.0"
description = "Open, reproducible spatial-audio building blocks for smart glasses and hearables."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "WonderfulClaire" }]
keywords = ["beamforming", "hearables", "microphone-array", "smart-glasses", "spatial-audio"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["ruff>=0.6"]

[project.scripts]
hearweave-demo = "hearweave.cli:main"

[project.urls]
Homepage = "https://github.com/WonderfulClaire/HearWeave"
Issues = "https://github.com/WonderfulClaire/HearWeave/issues"
Documentation = "https://github.com/WonderfulClaire/HearWeave/blob/main/docs/beambench.md"
Changelog = "https://github.com/WonderfulClaire/HearWeave/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
