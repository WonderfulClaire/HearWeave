name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: python -m unittest discover -s tests -v
      - run: hearweave-demo --output build/ci-demo
      - name: Build installable wheel
        run: python -m pip wheel --no-deps . --wheel-dir build/wheels
      - name: Smoke-test the end-user install
        run: |
          python -m venv build/smoke-venv
          build/smoke-venv/bin/python -m pip install --upgrade pip
          build/smoke-venv/bin/python -m pip install build/wheels/*.whl
          build/smoke-venv/bin/hearweave-demo --output build/wheel-demo
      - name: Generate showcase assets
        run: python scripts/generate_showcase.py --output build/showcase --frames 8 --fps 4
      - name: Check showcase assets
        run: test -s build/showcase/hearweave_showcase.png && test -s build/showcase/hearweave_showcase.gif
