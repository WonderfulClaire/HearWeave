name: Publish to PyPI

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

jobs:
  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tooling
        run: python -m pip install --upgrade build

      - name: Build sdist and wheel
        run: python -m build

      - name: Publish to PyPI (Trusted Publishing / OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
        # No `password` is provided on purpose: this uses PyPI Trusted
        # Publishing. Configure the PyPI project once at
        # https://pypi.org/manage/project/HearWeave/publishing/ to trust
        # WonderfulClaire/HearWeave + workflow `publish.yml` on the `pypi`
        # environment. After that, every matching tag publishes automatically.