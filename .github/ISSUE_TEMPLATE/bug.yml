name: Bug report
description: Report a reproducible processing or API problem
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Python, operating system, and device
    validations:
      required: true
  - type: textarea
    id: geometry
    attributes:
      label: Array geometry and sample rate
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
    validations:
      required: true
